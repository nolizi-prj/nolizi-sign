name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify synchronized product version
        run: npm run version:check

  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pumasi_sign_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5433/pumasi_sign_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install LibreOffice (for docx/xlsx/pptx conversion tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-calc libreoffice-impress fonts-noto-cjk fonts-nanum fonts-liberation fonts-crosextra-carlito fonts-crosextra-caladea

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Ruff check
        working-directory: backend
        run: ruff check .

      - name: Ruff format check
        working-directory: backend
        run: ruff format --check .

      - name: Run pytest
        working-directory: backend
        run: pytest

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # -b is not optional: frontend/tsconfig.json is a solution file (empty
      # `files`, two `references`), so `vue-tsc --noEmit` has no program to
      # check and exits 0 on a tree with type errors. Measured against
      # a49f594 with a deliberate error in src/stage.ts: --noEmit exits 0,
      # -b exits 2. --force because this step must check, not consult a
      # tsbuildinfo the Build step below may already have written.
      - name: Type-check
        working-directory: frontend
        run: npx vue-tsc -b --force

      - name: Unit tests
        working-directory: frontend
        run: npm run test:unit

      - name: Build
        working-directory: frontend
        run: npm run build

  # service/ is the Cloudflare Worker that answers sign.pumasi.ai (see
  # service/wrangler.jsonc's `custom_domain`). Until this job existed, CI ran
  # 541 backend test functions and six Playwright specs against the FastAPI
  # tree in backend/ -- which no user reaches -- and nothing at all against
  # this one. That is pumasi/DECISIONS.md Q-018 and roadmap/BACKLOG.md item 2.
  #
  # Which of the two trees IS the product is still open (Q-018) and is the
  # steward's; this job deletes nothing and re-points nothing. It only stops
  # `tests pass` from being silent about production.
  service:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: service/package-lock.json

      - name: Install service dependencies
        working-directory: service
        run: npm ci

      # Not optional, and not merely an optimisation: `npm test` below runs
      # dist/, and service/dist/ is .gitignore'd. Without this step the suite
      # matches no files, runs zero assertions and exits 0 (L-006).
      # `tsc -p tsconfig.json` is also this tree's only type-check.
      - name: Build the worker
        working-directory: service
        run: npm run build

      - name: Run the service suite
        working-directory: service
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/service-suite.tap"

      # The suite exiting 0 is not evidence that it ran. This reads its own
      # reported counts and the compiled tree, and is deliberately independent
      # of the Build step above, so deleting that step still turns this job
      # red. Exercised by frozen case A-104.
      - name: Assert the suite actually ran (L-006)
        run: >-
          .github/scripts/assert-service-suite-ran.sh
          service/src/test service/dist/test "$RUNNER_TEMP/service-suite.tap"

  e2e:
    runs-on: ubuntu-latest

    # A dedicated Postgres database for the e2e run — not the `backend`
    # job's database (separate jobs run on separate runners anyway) and
    # never the production Railway DB. Matches the ADMIN_EMAILS below,
    # which must stay in sync with frontend/e2e/constants.ts's ADMIN_EMAIL.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pumasi_sign_e2e
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright's Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build the Docker image
        run: docker build -t pumasi-sign:e2e .

      # --network host: lets the container reach the `postgres` service
      # (exposed on the runner's localhost:5433) via plain "localhost", and
      # serves the app directly on the runner's localhost:8080 with no -p
      # mapping needed. DATA_DIR is a plain in-container path — no volume —
      # since app/storage.py creates it on first write; container is
      # ephemeral and torn down at the end of this job either way.
      - name: Run the container
        run: |
          docker run -d --name pumasi-sign-e2e \
            --network host \
            -e PORT=8080 \
            -e DEV_AUTH_BYPASS=1 \
            -e DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5433/pumasi_sign_e2e \
            -e DATA_DIR=/data \
            -e ADMIN_EMAILS=e2e-admin@pumasi.ai \
            -e APP_BASE_URL=http://localhost:8080 \
            -e SESSION_SECRET=e2e-ci-session-secret \
            pumasi-sign:e2e

      - name: Wait for the container to become healthy
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/api/health > /dev/null; then
              echo "container is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "container did not become healthy in time" >&2
          docker logs pumasi-sign-e2e
          exit 1

      - name: Run Playwright e2e tests
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8080
        run: npx playwright test

      - name: Container logs
        if: always()
        run: docker logs pumasi-sign-e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop the container
        if: always()
        run: docker rm -f pumasi-sign-e2e
